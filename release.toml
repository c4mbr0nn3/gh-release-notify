# cargo-release config for gh-release-notify (local release flow).
# Invoked locally by the release script as:
#   cargo release --config release.toml --execute --no-confirm <level>
# NOTE: the pre-release-hook runs even under `cargo release --dry-run`,
# so the release script never invokes cargo-release in dry-run mode.
# This file is the single source of truth for release behavior; do NOT
# duplicate these settings under [package.metadata.release] in Cargo.toml.

allow-branch = ["main"]
sign-commit = false
sign-tag = false
push-remote = "origin"
consolidate-commits = false
pre-release-commit-message = "chore: release v{{version}}"
pre-release-hook = ["git", "cliff", "--unreleased", "--tag", "v{{version}}", "--prepend", "CHANGELOG.md"]
tag = true
tag-name = "v{{version}}"
tag-message = "chore: release v{{version}}"
push = true
publish = false
verify = true