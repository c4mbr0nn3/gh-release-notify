# Tag-triggered release pipeline (atomic).
# A release starts locally: scripts/release.sh + cargo-release land the tag.
# A tag push triggers this workflow: gate, vuln scans, multi-arch
# image build/push to GHCR, SARIF upload, git-cliff release body, GitHub Release.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release on the tag
      packages: write # push image to GHCR
      security-events: write # upload SARIF from trivy scans
      attestations: write # provenance/sbom attestations
      id-token: write # required for attestations
    steps:
      # 1. Checkout + pinned toolchain (must match Dockerfile rust:1.98.1-slim)
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history: git-cliff changelog needs all tags

      - name: Rust toolchain 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # 2. Verification gate
      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy -- -D warnings

      - name: cargo test
        run: cargo test

      # 3. Early vuln gate (pre-build, blocking): Cargo.lock advisories +
      #    Dockerfile misconfig checks.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif

      # 4. Build + push multi-arch image with attestations and OCI annotations
      - name: Extract version from tag
        id: version
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/c4mbr0nn3/gh-release-notify
          annotations: |
            org.opencontainers.image.title=gh-release-notify
            org.opencontainers.image.description=GitHub release notification daemon
            org.opencontainers.image.source=https://github.com/c4mbr0nn3/gh-release-notify
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Build amd64 image locally for the post-push trivy image scan:
      #    the pushed ref is a multi-arch manifest list that trivy cannot
      #    scan reliably; scanning a locally-loaded single-platform image
      #    (same Dockerfile, same tags context) is the plan-approved fix.
      - name: Build amd64 image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Late vuln gate (post-push, blocking): only findings with an
      #    available fix. Scans the locally-built amd64 image.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/c4mbr0nn3/gh-release-notify:${{ steps.version.outputs.tag }}
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif

      # 7. SARIF uploads to the Security tab. Uploads run even when a scan
      #    blocked the job, but only if trivy actually produced the SARIF file.
      - name: Check SARIF files exist
        if: always()
        id: sarif
        run: |
          echo "fs=$([ -f trivy-fs.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "image=$([ -f trivy-image.sarif ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload filesystem scan SARIF
        if: always() && steps.sarif.outputs.fs == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Upload image scan SARIF
        if: always() && steps.sarif.outputs.image == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # 8. git-cliff, exact-pinned (MSRV 1.88 < toolchain 1.98.1)
      - name: Install git-cliff
        run: cargo install git-cliff --locked --version 2.14.1

      # 9. Render release body from cliff.toml
      - name: Generate changelog
        run: git cliff --unreleased --tag "${{ steps.version.outputs.tag }}" --strip all > release-body.md

      # 10. Create GitHub Release with the git-cliff body
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release-body.md
