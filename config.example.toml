# How often to poll GitHub, in seconds. Minimum 60.
# Used as fallback when cron_expression is not set.
poll_interval_seconds = 3600

# Optional: cron expression to control poll timing. If present, takes
# precedence over poll_interval_seconds. Standard 5-field syntax:
#   minute hour day-of-month month day-of-week
# Examples:
#   "0 */6 * * *"      every 6 hours
#   "0 9 * * 1-5"      09:00 on weekdays
#   "*/15 * * * *"     every 15 minutes
# Timezone is UTC. Day-of-week: 1=Sunday .. 7=Saturday.
# Shorthand: @hourly, @daily, @weekly, @monthly, @yearly
# cron_expression = "0 */6 * * *"

# Path to the state file (last-seen tags).
# For Docker/compose deployment use /state/state.json (the mounted volume).
# For local runs use ./state.json.
state_path = "/state/state.json"

# Email "From" address for notifications.
sender = "gh-release-notify@homelab.local"

# Repos to watch, as "owner/repo".
repos = ["fosrl/pangolin", "fosrl/newt"]

# Recipient email addresses.
recipients = ["you@example.com"]

[smtp]
host = "smtp.example.com"
port = 587
# TLS mode: "starttls" (port 587) | "tls" (implicit TLS, port 465) | "none" (plain, port 25)
encryption = "starttls"
username = "postmaster@example.com"
# Prefer setting the password via SMTP_PASSWORD env var instead of here.
password = "changeme"

# ---------------------------------------------------------------------------
# Web UI (optional). Serves a small status/config page from the daemon.
# Access is gated by EXACTLY ONE of three modes:
#   1. Admin token  -> set admin_token below (or the ADMIN_TOKEN env var).
#   2. Trusted proxy header -> set trust_proxy_auth = true (reverse proxy must
#      set Remote-User; only do this when the UI port is not directly reachable).
#   3. Open (no token, no proxy trust) -> anyone who can reach the port may edit
#      this config. Only acceptable on a trusted network.
# Setting BOTH a token and trust_proxy_auth = true is a startup error.
#
# bind_addr and port are NOT editable from the UI and require a restart.
# The shipped docker-compose.yml sets bind_addr = "0.0.0.0" because the
#   container's loopback is not reachable from the host.
[ui]
bind_addr = "127.0.0.1"
port = 8080
# Prefer supplying the token via the ADMIN_TOKEN environment variable so it is
# not stored in this file. Leave empty to disable token login.
admin_token = ""
trust_proxy_auth = false
